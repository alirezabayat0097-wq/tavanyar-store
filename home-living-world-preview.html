<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('city-canvas-container');
    const loading = document.getElementById('loading-city');

    // ۱. صحنه و رندرر (با تنظیمات واقعی‌گرایانه)
    const scene = new THREE.Scene();
    // آسمان با رنگ گرادیانت ملایم
    const skyColor = new THREE.Color(0x87CEEB);
    scene.background = skyColor;
    scene.fog = new THREE.Fog(0x87CEEB, 60, 150); // مه واقعی

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 30, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap; // سایه‌های نرم
    renderer.toneMapping = THREE.ACESFilmicToneMapping; // تون مپینگ سینمایی
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    
    loading.style.display = 'none'; 
    container.appendChild(renderer.domElement);

    // ۲. کنترلر دوربین (چرخش کامل ۳۶۰ درجه)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;
    controls.maxPolarAngle = Math.PI / 2.1; // جلوگیری از رفتن به زیر زمین
    controls.minDistance = 20;
    controls.maxDistance = 100;
    controls.target.set(0, 5, 0);

    // ۳. نورپردازی واقعی (خورشید + آسمان)
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff5e6, 2.5);
    dirLight.position.set(30, 50, 30);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 150;
    dirLight.shadow.camera.left = -60;
    dirLight.shadow.camera.right = 60;
    dirLight.shadow.camera.top = 60;
    dirLight.shadow.camera.bottom = -60;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    // ۴. بافت محیطی (Environment Map) برای انعکاس شیشه‌ها
    // ما یک محیط ساده از رنگ آسمان می‌سازیم تا شیشه‌ها آن را منعکس کنند
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x87CEEB);
    const envLight = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide }));
    envScene.add(envLight);
    const envMap = pmremGenerator.fromScene(envScene).texture;
    scene.environment = envMap;

    // ۵. زمین (چمن واقعی با نویز)
    const groundGeo = new THREE.CircleGeometry(80, 64);
    // بافت چمن با نویز
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#4ade80'; ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 20000; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? '#22c55e' : '#15803d';
        ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
    }
    const grassTexture = new THREE.CanvasTexture(canvas);
    grassTexture.wrapS = grassTexture.wrapT = THREE.RepeatWrapping;
    grassTexture.repeat.set(20, 20);
    
    const groundMat = new THREE.MeshStandardMaterial({ map: grassTexture, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // آسفالت
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.95 });
    const road1 = new THREE.Mesh(new THREE.PlaneGeometry(100, 10), roadMat);
    road1.rotation.x = -Math.PI / 2;
    road1.position.y = 0.01;
    road1.receiveShadow = true;
    scene.add(road1);
    const road2 = new THREE.Mesh(new THREE.PlaneGeometry(10, 100), roadMat);
    road2.rotation.x = -Math.PI / 2;
    road2.position.y = 0.02;
    road2.receiveShadow = true;
    scene.add(road2);

    // خط کشی خیابان
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24 });
    for (let i = -45; i <= 45; i += 4) {
        const line = new THREE.Mesh(new THREE.PlaneGeometry(2, 0.4), lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(i, 0.03, 0);
        scene.add(line);
    }

    // ۶. تابع ساخت ساختمان مدرن
    function createBuilding(x, z, width, depth, height, baseColor, isGlass, onClick) {
        const group = new THREE.Group();
        
        // بدنه اصلی
        let bodyMat;
        if (isGlass) {
            // متریال شیشه‌ای واقعی
            bodyMat = new THREE.MeshPhysicalMaterial({
                color: 0x88ccff,
                metalness: 0.1,
                roughness: 0.05,
                transmission: 0.9, // شفافیت
                thickness: 0.5,
                ior: 1.5,
                envMapIntensity: 1.5
            });
        } else {
            bodyMat = new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.4, metalness: 0.2 });
        }
        
        const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), bodyMat);
        body.position.y = height / 2;
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);

        // نوارهای افقی برای طبقات (جزئیات واقعی)
        if (!isGlass) {
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6 });
            for (let f = 2; f < height; f += 2.5) {
                const floorLine = new THREE.Mesh(new THREE.BoxGeometry(width * 1.02, 0.2, depth * 1.02), floorMat);
                floorLine.position.y = f;
                group.add(floorLine);
            }
        }

        // پنجره‌ها (برای ساختمان‌های غیرشیشه‌ای)
        if (!isGlass) {
            const windowGeo = new THREE.BoxGeometry(0.6, 1, 0.1);
            const windowMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                emissive: 0xffffaa, 
                emissiveIntensity: 0.6,
                metalness: 0.8,
                roughness: 0.2
            });
            const windowsPerFloor = Math.floor(width / 2);
            const floors = Math.floor(height / 3);
            
            for (let f = 1; f < floors; f++) {
                for (let w = 0; w < windowsPerFloor; w++) {
                    const win = new THREE.Mesh(windowGeo, windowMat);
                    win.position.set(-width/2 + 1 + w * (width/windowsPerFloor), f * 3, depth/2 + 0.05);
                    group.add(win);
                    
                    const winBack = win.clone();
                    winBack.position.z = -depth/2 - 0.05;
                    group.add(winBack);
                }
            }
        }

        // سقف
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
        const roof = new THREE.Mesh(new THREE.BoxGeometry(width * 1.05, 0.5, depth * 1.05), roofMat);
        roof.position.y = height + 0.25;
        roof.castShadow = true;
        group.add(roof);

        // آنتن روی سقف
        const antennaMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.9, roughness: 0.2 });
        const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3, 8), antennaMat);
        antenna.position.y = height + 1.5;
        group.add(antenna);

        group.position.set(x, 0, z);
        group.userData.isBuilding = true;
        group.userData.onClick = onClick;
        scene.add(group);
        return group;
    }

    // ۷. ساخت ساختمان‌های شهر
    // پاساژ سفیران (شیشه‌ای، بزرگ)
    const ambassadorsBuilding = createBuilding(-18, -18, 14, 14, 25, 0x88ccff, true, () => switchTab('home'));
    
    // هایپر (فروشگاه، آجری مدرن)
    const marketBuilding = createBuilding(18, -18, 16, 12, 15, 0xb91c1c, false, () => switchTab('market'));
    
    // برج مهارت (بلند، خاکستری)
    const skillsBuilding = createBuilding(-18, 18, 10, 10, 35, 0x475569, false, () => switchTab('ambassador-app'));
    
    // پارک شهر توان (گنبدی/دایره‌ای)
    const parkGroup = new THREE.Group();
    const domeMat = new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 0.3, metalness: 0.1 });
    const dome = new THREE.Mesh(new THREE.SphereGeometry(8, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), domeMat);
    dome.position.y = 0;
    dome.castShadow = true;
    parkGroup.add(dome);
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
    const base = new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 2, 32), baseMat);
    base.position.y = 1;
    parkGroup.add(base);
    parkGroup.position.set(18, 0, 18);
    parkGroup.userData.isBuilding = true;
    parkGroup.userData.onClick = () => switchTab('city');
    scene.add(parkGroup);

    // چند ساختمان تزئینی پس‌زمینه
    createBuilding(-35, -5, 8, 8, 20, 0x94a3b8, false, null);
    createBuilding(35, -5, 8, 8, 18, 0x64748b, false, null);
    createBuilding(-5, -35, 8, 8, 22, 0x475569, false, null);
    createBuilding(5, 35, 8, 8, 16, 0x94a3b8, false, null);

    // ۸. درختان واقعی‌تر
    function createTree(x, z) {
        const group = new THREE.Group();
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 4, 8), trunkMat);
        trunk.position.y = 2;
        trunk.castShadow = true;
        group.add(trunk);
        
        // برگ‌های سه‌لایه
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.8 });
        const l1 = new THREE.Mesh(new THREE.SphereGeometry(2, 8, 8), leavesMat);
        l1.position.y = 4.5; l1.castShadow = true;
        const l2 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), leavesMat);
        l2.position.set(0.8, 5.5, 0.5); l2.castShadow = true;
        const l3 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), leavesMat);
        l3.position.set(-0.8, 5.5, -0.5); l3.castShadow = true;
        
        group.add(l1, l2, l3);
        group.position.set(x, 0, z);
        scene.add(group);
    }

    // پخش درختان در فضای سبز
    for (let i = 0; i < 60; i++) {
        const x = (Math.random() - 0.5) * 100;
        const z = (Math.random() - 0.5) * 100;
        if (Math.abs(x) > 8 && Math.abs(z) > 8) {
            createTree(x, z);
        }
    }

    // ۹. استخر/آب‌نما
    const waterGeo = new THREE.CircleGeometry(6, 32);
    const waterMat = new THREE.MeshPhysicalMaterial({
        color: 0x0284c7,
        metalness: 0.1,
        roughness: 0.05,
        transmission: 0.9,
        thickness: 1,
        ior: 1.33,
        envMapIntensity: 2
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.set(0, 0.1, 0);
    scene.add(water);

    // ۱۰. انیمیشن
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // ۱۱. تغییر سایز
    window.addEventListener('resize', () => {
        if (container.clientWidth > 0) {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
    });

    // ۱۲. کلیک روی ساختمان‌ها (Raycaster)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isDragging = false;

    container.addEventListener('mousedown', () => { isDragging = false; });
    container.addEventListener('mousemove', () => { isDragging = true; });

    container.addEventListener('click', (event) => {
        if (isDragging) return;
        const rect = container.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);

        for (let i = 0; i < intersects.length; i++) {
            let obj = intersects[i].object;
            while (obj.parent && !obj.userData.isBuilding) obj = obj.parent;
            if (obj.userData.isBuilding && obj.userData.onClick) {
                obj.scale.set(1.05, 1.05, 1.05);
                setTimeout(() => obj.scale.set(1, 1, 1), 200);
                obj.userData.onClick();
                break;
            }
        }
    });
    
    container.addEventListener('touchstart', () => { isDragging = false; });
    container.addEventListener('touchmove', () => { isDragging = true; });
    container.addEventListener('touchend', (event) => {
        if (isDragging) return;
        const touch = event.changedTouches[0];
        const rect = container.getBoundingClientRect();
        mouse.x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((touch.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);
        for (let i = 0; i < intersects.length; i++) {
            let obj = intersects[i].object;
            while (obj.parent && !obj.userData.isBuilding) obj = obj.parent;
            if (obj.userData.isBuilding && obj.userData.onClick) {
                obj.scale.set(1.05, 1.05, 1.05);
                setTimeout(() => obj.scale.set(1, 1, 1), 200);
                obj.userData.onClick();
                break;
            }
        }
    });
</script>
