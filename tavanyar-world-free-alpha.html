<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#172b36">
<title>توان‌یار | جهان آزاد آزمایشی</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bc7ce;color:#fff;font-family:Tahoma,Arial,sans-serif;touch-action:none}
#world{position:fixed;inset:0}canvas{display:block}
header{position:fixed;z-index:3;top:env(safe-area-inset-top,10px);right:12px;left:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
.pill{background:#102b32d9;border:1px solid #ffffff35;border-radius:14px;padding:9px 12px;box-shadow:0 5px 20px #0002;backdrop-filter:blur(8px)}
.brand b{display:block;color:#baf4d7;font-size:14px}.brand small{display:block;color:#d2e5df;font-size:10px;margin-top:4px}
#coords{font-size:11px;color:#f4e8bd}
.tip{position:fixed;z-index:3;top:74px;right:12px;max-width:260px;background:#102b32c9;border:1px solid #ffffff2a;border-radius:12px;padding:9px 11px;font-size:11px;line-height:1.8;color:#effaf5;pointer-events:none}
.actions{position:fixed;z-index:4;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
button{border:1px solid #ffffff50;border-radius:13px;background:#102b32e8;color:white;padding:11px 14px;font:12px Tahoma;box-shadow:0 5px 18px #0003}
button.primary{background:#087b5d;border-color:#72e5b5;font-weight:bold}
#toast{position:fixed;z-index:6;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#102b32ed;border:1px solid #ffffff35;border-radius:30px;padding:10px 15px;font-size:11px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#panel{display:none;position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 34px));padding:18px;border-radius:20px;background:#102b32f2;border:1px solid #ffffff45;box-shadow:0 18px 60px #0007}
#panel.show{display:block}#panel h2{margin:0 0 9px;color:#baf4d7;font-size:18px}#panel p{font-size:13px;line-height:2;color:#e3f0ec}#panel button{width:100%;background:#087b5d}
@media(min-width:700px){.tip{top:88px;max-width:320px}.actions{left:24px;bottom:24px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="world"></div>
<header><div class="pill brand"><b>توان‌یار | جهان آزاد</b><small>نسخه آزمایشی · کنترل تک‌انگشتی و دوربین هوشمند</small></div><div class="pill" id="coords">میدان مرکزی</div></header>
<div class="tip">یک انگشت را مثل دستهٔ مجازی بکش: بالا جلو، پایین عقب، راست برای گردش به راست و چپ برای گردش به چپ؛ زاویهٔ گردش حداکثر ۳۰ درجه است.</div>
<div class="actions"><button id="home">بازگشت به میدان</button><button id="behind">دوربین پشت شخصیت</button><button class="primary" id="interact">تعامل با مکان نزدیک</button></div>
<div id="panel"><h2 id="panelTitle"></h2><p id="panelText"></p><button id="close">ادامه گشت‌وگذار</button></div>
<div id="toast"></div>
<script type="module">
import * as THREE from 'three';
const root=document.querySelector('#world'),scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fcbd0);scene.fog=new THREE.Fog(0x9fcbd0,90,310);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,800);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeafaff,0x62745c,2.1));
const sun=new THREE.DirectionalLight(0xfff0d7,1.8);sun.position.set(-35,65,28);scene.add(sun);
const mat=(c,r=.86)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grass=mat(0x78a977),asphalt=mat(0x59666a),stone=mat(0xd8cfb8),cream=mat(0xe9ddc5),glass=new THREE.MeshStandardMaterial({color:0x8ed3d3,roughness:.25,metalness:.12}),green=mat(0x267d5c),dark=mat(0x29434a);
function cube(p,x,y,z,w,h,d,m){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);p.add(o);return o}
function cyl(p,x,y,z,r,h,m,n=12){let o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,n),m);o.position.set(x,y,z);p.add(o);return o}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),grass);ground.rotation.x=-Math.PI/2;scene.add(ground);
for(let k=-7;k<=7;k++){cube(scene,k*38,.015,0,8,.03,650,asphalt);cube(scene,0,.016,k*38,650,.03,8,asphalt)}
for(let k=-16;k<=16;k++){cube(scene,k*19,.025,0,.22,.025,650,stone);cube(scene,0,.026,k*19,650,.025,.22,stone)}
cube(scene,0,.04,0,34,.08,34,cream);cyl(scene,0,.3,0,3,.55,stone,32);cyl(scene,0,.62,0,2.25,.12,glass,32);
let water=new THREE.Mesh(new THREE.CircleGeometry(2.1,32),new THREE.MeshBasicMaterial({color:0x58cbd0}));water.rotation.x=-Math.PI/2;water.position.y=.7;scene.add(water);
const places=[];
function building(name,info,x,z,color,w=16,d=13,h=12){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);let wall=mat(color),trim=mat(0xf1e7d2);
 cube(g,0,h/2,0,w,h,d,wall);cube(g,0,h+.35,0,w*.82,.7,d*.8,trim);
 cube(g,0,2,d/2+.08,w*.72,3.8,.16,glass);cube(g,0,1.8,d/2+.2,2.8,3.3,.18,dark);
 for(let xx=-w/2+2;xx<w/2;xx+=3.4)for(let yy=5;yy<h-1;yy+=3.1){cube(g,xx,yy,d/2+.08,1.7,1.8,.14,glass);cube(g,xx,yy+.98,d/2+.16,1.85,.13,.2,trim)}
 cube(g,0,4.15,d/2+.6,w*.62,.2,1.1,trim);
 for(let xx=-w/2+2;xx<w/2;xx+=4){cube(g,xx,4.65,d/2+.95,1.6,.14,.9,trim);cube(g,xx,4.95,d/2+1.15,1.1,.35,.45,green)}
 cube(g,0,h+1.1,0,w*.42,1.5,d*.42,mat(0x526c65));
 places.push({name,info,pos:new THREE.Vector3(x,0,z),halfW:w/2,halfD:d/2});
}
building('بازار توان','بازار محصولات و فروشگاه‌های سفیران توان‌یار؛ در نسخه‌های بعدی به داده‌های واقعی فروشگاه متصل می‌شود.',-34,-34,0xe5cfa7,17,14,11);
building('کارگاه سازندگان','فضای تولید، مهارت‌آموزی و همکاری کسب‌وکارهای اعضا.',34,-34,0xb8cdbd,17,14,13);
building('خانه اجتماع','محل رویدادها، آشنایی اعضا و معرفی استعدادها.',-34,34,0xd8c8e7,17,14,12);
building('مرکز شهر توان','بخش مأموریت‌ها، بازی‌ها، منابع و پیشرفت شهر.',34,34,0xa9c9df,17,14,14);
building('مرکز خدمات','فضای راهنمایی، خدمات و دسترسی به امکانات توان‌یار.',-76,0,0xd7dfcf,18,14,12);
building('گالری حامیان','نمایش مجموعه‌ها و کسب‌وکارهای حامی اشتغال فراگیر.',76,0,0xe8d9b8,18,14,12);
function tree(x,z,s=1){cyl(scene,x,.9*s,z,.23*s,1.8*s,mat(0x79563a));let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.3*s,1),mat(0x287b53));crown.position.set(x,2.4*s,z);scene.add(crown)}
for(let x=-145;x<=145;x+=19)for(let z=-145;z<=145;z+=19){if(Math.abs(x%38)<7||Math.abs(z%38)<7||(Math.abs(x)<24&&Math.abs(z)<24))continue;tree(x,z,.65+Math.random()*.3)}
// ویلچر و شخصیت
const avatar=new THREE.Group();scene.add(avatar);
const skin=mat(0xc98b68),shirt=mat(0x078b70),chair=mat(0x263c4c),rubber=mat(0x171d24),metal=mat(0xb6c8cc);
let body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.7,4,8),shirt);body.position.y=1.45;avatar.add(body);
let head=new THREE.Mesh(new THREE.SphereGeometry(.36,14,10),skin);head.position.y=2.35;avatar.add(head);
cube(avatar,0,.62,.12,1.2,.15,1.1,chair);cube(avatar,0,.94,-.34,1,.95,.16,chair);cube(avatar,0,.24,.36,.78,.12,.8,mat(0x283c58));
const wheelMeshes=[];for(let s of [-1,1]){let wheel=new THREE.Mesh(new THREE.TorusGeometry(.58,.075,8,24),rubber);wheel.rotation.y=Math.PI/2;wheel.position.set(s*.7,.63,.1);avatar.add(wheel);wheelMeshes.push(wheel);let hub=cyl(avatar,s*.71,.63,.1,.14,.12,metal);hub.rotation.z=Math.PI/2}
avatar.position.set(0,0,9);
let yaw=0;
let currentSpeed=0,targetSpeed=0,steerAngle=0,targetSteerAngle=0;
const maxSpeed=7.2,maxSteerAngle=THREE.MathUtils.degToRad(30);
const pointers=new Map();
let touchStart=null,lastTouch=null;
const canvas=renderer.domElement;
const raycaster=new THREE.Raycaster();
const cameraCandidates=[];
function setTouch(e){
 const p=pointers.get(e.pointerId);
 if(!p)return;
 p.x=e.clientX;p.y=e.clientY;
 const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;
 // محور عمودی سرعت جلو/عقب را کنترل می‌کند و محور افقی فرمان گردش را.
 // علامت فرمان اصلاح شده: کشیدن به راست، گردش به راست ایجاد می‌کند.
 const dead=13;
 const nx=Math.abs(dx)<dead?0:Math.sign(dx)*Math.min(1,(Math.abs(dx)-dead)/72);
 const ny=Math.abs(dy)<dead?0:Math.sign(dy)*Math.min(1,(Math.abs(dy)-dead)/78);
 targetSpeed=THREE.MathUtils.clamp(-ny*maxSpeed,-maxSpeed,maxSpeed);
 targetSteerAngle=THREE.MathUtils.clamp(-nx*maxSteerAngle,-maxSteerAngle,maxSteerAngle);
 lastTouch={x:e.clientX,y:e.clientY};
}
canvas.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 if(pointers.size>0)return;
 canvas.setPointerCapture(e.pointerId);
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 touchStart={x:e.clientX,y:e.clientY};lastTouch={...touchStart};
 targetSpeed=0;targetSteerAngle=0;
});
canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId))setTouch(e)});
function releasePointer(e){
 if(!pointers.has(e.pointerId))return;
 pointers.delete(e.pointerId);
 touchStart=null;lastTouch=null;targetSpeed=0;targetSteerAngle=0;
}
canvas.addEventListener('pointerup',releasePointer);
canvas.addEventListener('pointercancel',releasePointer);
canvas.addEventListener('lostpointercapture',releasePointer);
function blockedAt(pos){
 // دیوار ساختمان‌ها: حاشیهٔ امن برای عرض ویلچر
 for(const p of places){
  if(Math.abs(pos.x-p.pos.x)<p.halfW+.95 && Math.abs(pos.z-p.pos.z)<p.halfD+.95)return true;
 }
 // تنهٔ درخت‌ها: همان شبکهٔ درخت‌کاری محیط
 for(let x=-145;x<=145;x+=19)for(let z=-145;z<=145;z+=19){
  if(Math.abs(x%38)<7||Math.abs(z%38)<7||(Math.abs(x)<24&&Math.abs(z)<24))continue;
  const dx=pos.x-x,dz=pos.z-z;
  if(dx*dx+dz*dz<1.35*1.35)return true;
 }
 return Math.abs(pos.x)>320||Math.abs(pos.z)>320;
}
function isInsideBuilding(){
 for(const p of places){
  if(Math.abs(avatar.position.x-p.pos.x)<p.halfW*.43 &&
     Math.abs(avatar.position.z-p.pos.z)<p.halfD*.43)return true;
 }
 return false;
}
function cameraPositionAvoidingWalls(target,preferred,dt){
 // چند جایگاه اطراف آواتار آزمایش می‌شوند؛ اولین مسیر بدون برخورد انتخاب می‌شود.
 const back=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));
 const candidates=[
  preferred.clone(),
  avatar.position.clone().addScaledVector(back,7.8).addScaledVector(right,3.4).add(new THREE.Vector3(0,4.0,0)),
  avatar.position.clone().addScaledVector(back,7.8).addScaledVector(right,-3.4).add(new THREE.Vector3(0,4.0,0)),
  avatar.position.clone().addScaledVector(back,5.4).add(new THREE.Vector3(0,3.3,0))
 ];
 let chosen=candidates[candidates.length-1];
 for(const candidate of candidates){
  const direction=candidate.clone().sub(target);
  const distance=direction.length();
  raycaster.set(target,direction.normalize());
  const hits=raycaster.intersectObjects(scene.children,true).filter(h=>h.object!==ground && !avatar.getObjectById(h.object.id) && h.distance<distance-.45);
  if(hits.length===0){chosen=candidate;break;}
  const safeDistance=Math.max(2.0,hits[0].distance-.55);
  if(safeDistance>2.8)chosen=target.clone().addScaledVector(direction.normalize(),safeDistance);
 }
 return chosen;
}
const toast=document.querySelector('#toast');let toastTimer;function notify(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2400)}
function nearPlace(){let best=null,d=Infinity;for(let p of places){let n=avatar.position.distanceTo(p.pos);if(n<d){d=n;best=p}}return d<23?best:null}
function interact(){let p=nearPlace();if(!p){notify('به یکی از ساختمان‌ها نزدیک‌تر شو تا بتوانی تعامل کنی.');return}document.querySelector('#panelTitle').textContent=p.name;document.querySelector('#panelText').textContent=p.info;document.querySelector('#panel').classList.add('show')}
document.querySelector('#interact').onclick=interact;document.querySelector('#close').onclick=()=>document.querySelector('#panel').classList.remove('show');
function behindCharacter(){notify('دوربین به‌صورت خودکار بهترین زاویه را انتخاب می‌کند.');}
document.querySelector('#behind').onclick=behindCharacter;

document.querySelector('#home').onclick=()=>{avatar.position.set(0,0,9);avatar.rotation.y=0;currentSpeed=0;targetSpeed=0;steerAngle=0;targetSteerAngle=0;yaw=0;document.querySelector('#panel').classList.remove('show');notify('به میدان مرکزی برگشتی.')};
const clock=new THREE.Clock(),look=new THREE.Vector3(),forward=new THREE.Vector3(),desired=new THREE.Vector3(),moveDir=new THREE.Vector3();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 // فرمان نرم است و زاویهٔ بدنه هرگز از ۳۰ درجه به چپ یا راست بیشتر نمی‌شود.
 currentSpeed=THREE.MathUtils.damp(currentSpeed,targetSpeed,13.5,dt);
 steerAngle=THREE.MathUtils.damp(steerAngle,targetSteerAngle,9,dt);
 yaw=steerAngle;
 avatar.rotation.y=yaw;
 const forward=new THREE.Vector3(-Math.sin(yaw),0,Math.cos(yaw));
 if(Math.abs(currentSpeed)>.025){
  const longitudinal=forward.multiplyScalar(currentSpeed*dt);
  const proposed=avatar.position.clone().add(longitudinal);
  if(!blockedAt(proposed)) avatar.position.copy(proposed);
  else {currentSpeed=0;targetSpeed=0;}
  for(const wheel of wheelMeshes)wheel.rotation.x-=currentSpeed*dt/.58;
 }
 const indoor=isInsideBuilding();
 const target=new THREE.Vector3(avatar.position.x,avatar.position.y+(indoor?2.05:1.35),avatar.position.z);
 if(indoor){
  // داخل ساختمان: نمای اول‌شخص از دید آواتار، بدون نمایش خود آواتار.
  const lookDir=new THREE.Vector3(-Math.sin(yaw),0,Math.cos(yaw));
  const firstPerson=target.clone().add(new THREE.Vector3(0,.02,0));
  camera.position.lerp(firstPerson,1-Math.exp(-5.5*dt));
  camera.lookAt(firstPerson.clone().addScaledVector(lookDir,8).add(new THREE.Vector3(0,.1,0)));
 }else{
  // دوربین سوم‌شخص دنبال آواتار می‌آید و همیشه به خود آواتار نگاه می‌کند.
  // فاصلهٔ پشت شانه با جهت حرکت هماهنگ است؛ دوربین دیگر آواتار را از کادر置 نمی‌گذارد.
  const back=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
  const side=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));
  const preferred=avatar.position.clone().addScaledVector(back,7.2).addScaledVector(side,-1.15).add(new THREE.Vector3(0,3.7,0));
  const safe=cameraPositionAvoidingWalls(target,preferred,dt);
  camera.position.lerp(safe,1-Math.exp(-6.5*dt));
  camera.lookAt(target.clone().add(new THREE.Vector3(0,.35,0)));
 }
 document.querySelector('#coords').textContent=indoor?'نمای داخلی · دید آواتار':Math.abs(currentSpeed)>.15?(currentSpeed<0?'حرکت به عقب':'حرکت رو به جلو'):'جهان آزاد · آماده حرکت';
 renderer.render(scene,camera);
}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.2));renderer.setSize(innerWidth,innerHeight)});
notify('کنترل فعال شد: جلو/عقب و گردش حداکثر ۳۰ درجه');
</script>
</body></html>
